<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>History · TreeSaathi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/history.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="app-shell">
    <div id="menubar">
      <button class="burger-btn" aria-label="Menu">
        <i class="fa fa-bars" aria-hidden="true"></i>
      </button>
      <h2>History</h2>
    </div>

    <div id="content">
      <div id="filter-chips">
        <div class="chip active" data-filter="all">All</div>
        <div class="chip" data-filter="plant">Planted</div>
        <div class="chip" data-filter="water">Watered</div>
        <div class="chip" data-filter="report">Reported</div>
        <div class="chip" data-filter="adopt">Adopted</div>
      </div>

      <div id="timeline"></div>

      <div class="empty-state" id="emptyState" hidden>
        <div class="icon-circle"><i class="fa fa-leaf" aria-hidden="true"></i></div>
        <p>No activity here yet.<br>Get out there and plant a tree!</p>
      </div>
    </div>

    <div id="toolbar">
      <a href="/"><button><i class="fa fa-map-marker" aria-hidden="true"></i></button></a>
      <a href="/dictionary"><button><i class="fa fa-book" aria-hidden="true"></i></button></a>
      <a href="/"><button class="fab"><i class="fa fa-plus" aria-hidden="true"></i></button></a>
      <a href="/history"><button class="active"><i class="fa fa-history" aria-hidden="true"></i></button></a>
      <a href="/profile"><button><i class="fa fa-user" aria-hidden="true"></i></button></a>
    </div>
  </div>

  <script type="module" src="/script/history.js"></script>
</body>
</html>
