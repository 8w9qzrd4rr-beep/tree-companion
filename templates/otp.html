<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verify Email · TreeSaathi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
  /* ============ BASE ============ */
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: #f2f2f2;
    overscroll-behavior: none;
  }

  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; }

  .app-shell {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  @media (min-width: 640px) {
    .app-shell {
      max-width: 480px;
      height: min(100vh, 900px);
      height: min(100dvh, 900px);
      margin: 24px auto;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      border: 1px solid #e5e5e5;
    }
  }

  @media (min-width: 1024px) {
    .app-shell {
      max-width: 520px;
      margin: 40px auto;
    }
  }

  /* ============ OTP PAGE ============ */
  .signup-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 30px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .step-track {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding-top: 28px;
    flex-shrink: 0;
  }

  .step-dot {
    width: 26px;
    height: 4px;
    border-radius: 2px;
    background: #e5e5e5;
  }

  .step-dot.active { background: #2e7d32; }
  .step-dot.done { background: #2e7d32; }

  .back-row {
    padding-top: 18px;
    flex-shrink: 0;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: #6b6b6b;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 0;
  }

  .back-btn:hover { color: #1a1a1a; }

  .signup-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4vh;
    padding-bottom: 30px;
    text-align: center;
    flex-shrink: 0;
  }

  .signup-brand .icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: #2e7d32;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 14px;
    box-shadow: 0 8px 18px rgba(46, 125, 50, 0.3);
  }

  .signup-brand h1 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .signup-brand p {
    margin: 0;
    font-size: 12.5px;
    color: #8a8a8a;
    max-width: 280px;
    line-height: 1.5;
  }

  .signup-brand p strong {
    color: #1a1a1a;
    font-weight: 600;
  }

  #otp-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex-shrink: 0;
  }

  .otp-boxes {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .otp-boxes input {
    width: 100%;
    aspect-ratio: 1 / 1;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #1a1a1a;
    background: #f7f7f7;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .otp-boxes input:focus {
    border-color: #2e7d32;
    background: #fff;
  }

  .otp-boxes input.filled {
    border-color: #cfe4cf;
  }

  .error-text {
    font-size: 12px;
    color: #c0392b;
    margin: -6px 0 0;
    min-height: 14px;
    text-align: center;
  }

  .resend-row {
    text-align: center;
    font-size: 12.5px;
    color: #8a8a8a;
  }

  .resend-row button {
    background: none;
    border: none;
    color: #2e7d32;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    padding: 0;
  }

  .resend-row button:disabled {
    color: #b0b0b0;
    cursor: not-allowed;
  }

  .btn-primary {
    margin-top: 4px;
    width: 100%;
    background: #2e7d32;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 13px 0;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-primary:hover { background: #256628; }
  .btn-primary:disabled { background: #a8c9aa; cursor: not-allowed; }

  .login-row {
    text-align: center;
    font-size: 13px;
    color: #666;
    padding: 22px 0 30px;
    flex-shrink: 0;
    margin-top: auto;
  }

  .login-row a { color: #2e7d32; font-weight: 600; }
</style>
</head>
<body>
  <div class="app-shell">
    <div class="signup-shell">

      <div class="step-track">
        <div class="step-dot done"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>

      <div class="back-row">
        <button class="back-btn" type="button" onclick="window.location.href='/signup.html'">
          <i class="fa fa-angle-left" aria-hidden="true"></i> Back
        </button>
      </div>

      <div class="signup-brand">
        <div class="icon-circle"><i class="fa fa-envelope-o" aria-hidden="true"></i></div>
        <h1>Verify your email</h1>
        <p>Enter the 6-digit code we sent to <strong id="emailTarget">your email</strong></p>
      </div>

      <form id="otp-form" novalidate>
        <div class="otp-boxes" id="otpBoxes">
          <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" />
          <input type="text" inputmode="numeric" maxlength="1" />
          <input type="text" inputmode="numeric" maxlength="1" />
          <input type="text" inputmode="numeric" maxlength="1" />
          <input type="text" inputmode="numeric" maxlength="1" />
          <input type="text" inputmode="numeric" maxlength="1" />
        </div>

        <p class="error-text" id="errorText"></p>

        <div class="resend-row">
          <span id="resendLabel">Resend code in <strong id="resendTimer">30s</strong></span>
          <button type="button" id="resendBtn" style="display:none;">Resend code</button>
        </div>

        <button type="submit" class="btn-primary" id="verifyBtn" disabled>Verify</button>
      </form>

      <p class="login-row">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>

<script type="module" src="/script/otp.js"></script>
</body>
</html>
