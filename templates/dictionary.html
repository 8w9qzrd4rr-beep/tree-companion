<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tree Dictionary · TreeSaathi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dictionary.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="app-shell">
    <div id="menubar">
      <button class="burger-btn" aria-label="Menu">
        <i class="fa fa-bars" aria-hidden="true"></i>
      </button>
      <h2>Tree Dictionary</h2>
    </div>

    <div id="content">
      <div id="search-wrap">
        <div id="search-box">
          <i class="fa fa-search" aria-hidden="true"></i>
          <input type="text" id="searchInput" placeholder="Search species...">
        </div>
      </div>

      <div id="species-list"></div>
      <p class="no-results" id="noResults" hidden>No species found.</p>
    </div>

    <div id="toolbar">
      <a href="/"><button><i class="fa fa-map-marker" aria-hidden="true"></i></button></a>
      <a href="/dictionary"><button class="active"><i class="fa fa-book" aria-hidden="true"></i></button></a>
      <a href="/"><button class="fab"><i class="fa fa-plus" aria-hidden="true"></i></button></a>
      <a href="/history"><button><i class="fa fa-history" aria-hidden="true"></i></button></a>
      <a href="/profile"><button><i class="fa fa-user" aria-hidden="true"></i></button></a>
    </div>
  </div>

  <script type="module" src="/script/dictionary.js"></script>
</body>
</html>
